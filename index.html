<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ley de Ohm — Circuito 3D</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #101b2d;
    color: white;
    font-family: Arial, sans-serif;
  }

  canvas { display: block; }

  #interfaz {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  #panel {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    right: 10px;
    max-width: 420px;
    padding: 12px;
    border-radius: 14px;
    background: rgba(16,27,45,.92);
    pointer-events: auto;
    max-height: 42vh;
    overflow: auto;
  }

  h1 { margin: 0 0 8px; font-size: 21px; }

  .fila {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
  }

  label { font-size: 14px; }

  select, button {
    min-height: 44px;
    font-size: 16px;
    border: 0;
    border-radius: 8px;
    padding: 10px;
  }

  button {
    background: #2774e8;
    color: white;
  }

  button:disabled { opacity: .5; }

  #lectura {
    color: #67efb4;
    font-size: 22px;
    font-weight: bold;
  }

  #formula { font-size: 13px; margin-top: 5px; }

  #pie {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: max(18px, env(safe-area-inset-bottom));
    text-align: center;
  }

  #mensaje {
    display: inline-block;
    max-width: 500px;
    background: rgba(0,0,0,.8);
    padding: 11px;
    border-radius: 10px;
    font-size: 14px;
    white-space: pre-line;
  }

  #colocar {
    pointer-events: auto;
    display: block;
    margin: 10px auto 0;
    background: #14804a;
  }

  [hidden] { display: none !important; }
</style>

<script>
  // También informa si falla la descarga de Three.js.
  window.addEventListener("error", function(evento) {
    const panel = document.getElementById("mensaje");
    if (panel && evento.message) {
      panel.textContent = "Error: " + evento.message;
    }
  });

  window.addEventListener("unhandledrejection", function(evento) {
    const panel = document.getElementById("mensaje");
    if (panel) {
      panel.textContent = "Error: " +
        (evento.reason?.message || String(evento.reason));
    }
  });
</script>
</head>

<body>

<div id="interfaz">
  <section id="panel">
    <h1>Ley de Ohm · Circuito 3D</h1>

    <div class="fila">
      <button id="iniciar" disabled>Comprobando AR…</button>
      <button id="salir" hidden>Salir de AR</button>
    </div>

    <div class="fila">
      <label>
        Voltaje
        <select id="voltaje">
          <option value="3">3 V</option>
          <option value="6" selected>6 V</option>
          <option value="12">12 V</option>
        </select>
      </label>

      <label>
        Resistencia
        <select id="resistencia">
          <option value="100" selected>100 Ω</option>
          <option value="200">200 Ω</option>
          <option value="300">300 Ω</option>
        </select>
      </label>
    </div>

    <div class="fila">
      <button id="interruptor">Abrir circuito</button>
      <button id="reubicar" hidden>Reubicar</button>
    </div>

    <div id="lectura" aria-live="polite"></div>
    <div id="formula"></div>
  </section>

  <div id="pie">
    <div id="mensaje" role="status">Cargando circuito 3D…</div>
    <button id="colocar" hidden disabled>
      Buscando superficie…
    </button>
  </div>
</div>

<script type="module">
import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const $ = id => document.getElementById(id);

let sesion = null;
let fuenteHit = null;
let buscando = false;
let cerrado = true;
let corriente = .06;
let avance = 0;
let anterior = null;

const escena = new THREE.Scene();

const camara = new THREE.PerspectiveCamera(
  55, innerWidth / innerHeight, .01, 30
);

// Vista inicial de comprobación.
camara.position.set(0, .6, .65);
camara.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;

// Usamos el mismo espacio para detectar y dibujar.
renderer.xr.setReferenceSpaceType("local");

document.body.prepend(renderer.domElement);

escena.add(new THREE.HemisphereLight(0xffffff, 0x536173, 2));

const luz = new THREE.DirectionalLight(0xffffff, 2);
luz.position.set(1, 3, 2);
escena.add(luz);

// Contenedor que se colocará sobre la mesa.
const soporte = new THREE.Group();
escena.add(soporte);

const modelo = new THREE.Group();
modelo.scale.setScalar(.12);
soporte.add(modelo);

function material(color) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: .6
  });
}

function caja(w,h,d,color,x,y,z,grupo=modelo) {
  const objeto = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material(color)
  );
  objeto.position.set(x,y,z);
  grupo.add(objeto);
  return objeto;
}

function esfera(x,y,z) {
  const objeto = new THREE.Mesh(
    new THREE.SphereGeometry(.075,16,12),
    material(0xdddddd)
  );
  objeto.position.set(x,y,z);
  modelo.add(objeto);
}

function cable(a,b) {
  const inicio = new THREE.Vector3(...a);
  const final = new THREE.Vector3(...b);
  const vector = final.clone().sub(inicio);

  const objeto = new THREE.Mesh(
    new THREE.CylinderGeometry(.025,.025,vector.length(),12),
    material(0x30c8ff)
  );

  objeto.position.copy(inicio).add(final).multiplyScalar(.5);

  objeto.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    vector.normalize()
  );

  modelo.add(objeto);
}

function texto(contenido,x,y,z,ancho=1) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 128;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "white";
  ctx.font = "bold 52px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(contenido,256,64);

  const textura = new THREE.CanvasTexture(canvas);
  textura.colorSpace = THREE.SRGBColorSpace;

  const objeto = new THREE.Mesh(
    new THREE.PlaneGeometry(ancho,ancho/4),
    new THREE.MeshBasicMaterial({
      map: textura,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );

  objeto.rotation.x = -Math.PI/2;
  objeto.position.set(x,y,z);
  modelo.add(objeto);
}

// Placa de unos 36 × 29 cm en AR.
caja(3,.08,2.4,0x18283e,0,.04,0);

// Batería.
caja(.4,.4,.7,0x20ae71,-1.2,.3,0);
caja(.16,.15,.08,0xf05c5c,-1.2,.25,-.39);
caja(.16,.15,.08,0xcccccc,-1.2,.25,.39);

texto("+",-1.2,.505,-.2,.3);
texto("−",-1.2,.505,.2,.3);

// Resistencia.
caja(.8,.28,.3,0xd8ad72,0,.25,-.9);
texto("R",0,.395,-.9,.35);

texto("LEY DE OHM",.15,.085,-.15,1.4);
texto("V = I × R",.15,.085,.2,1.2);

// Cables: dejan espacio para batería, resistencia e interruptor.
[
  [[-1.2,.24,-.39],[-1.2,.24,-.9]],
  [[-1.2,.24,-.9],[-.4,.24,-.9]],
  [[.4,.24,-.9],[1.2,.24,-.9]],
  [[1.2,.24,-.9],[1.2,.24,.9]],
  [[1.2,.24,.9],[.35,.24,.9]],
  [[-.35,.24,.9],[-1.2,.24,.9]],
  [[-1.2,.24,.9],[-1.2,.24,.39]]
].forEach(([a,b]) => cable(a,b));

// Interruptor que se abre hacia arriba.
esfera(-.35,.24,.9);
esfera(.35,.24,.9);

const brazo = new THREE.Group();
brazo.position.set(-.35,.24,.9);
modelo.add(brazo);

caja(.7,.07,.12,0xff9f32,.35,0,0,brazo);

// Flechas ilustrativas de corriente convencional.
const puntos = [
  [-1.2,.55,-.39],
  [-1.2,.55,-.9],
  [1.2,.55,-.9],
  [1.2,.55,.9],
  [-1.2,.55,.9],
  [-1.2,.55,.39]
].map(p => new THREE.Vector3(...p));

const tramos = [];
let longitudTotal = 0;

for (let i=0; i<puntos.length-1; i++) {
  const vector = puntos[i+1].clone().sub(puntos[i]);
  const longitud = vector.length();

  tramos.push({
    inicio: puntos[i],
    direccion: vector.normalize(),
    longitud
  });

  longitudTotal += longitud;
}

const flechas = [];

for (let i=0; i<8; i++) {
  const flecha = new THREE.ArrowHelper(
    new THREE.Vector3(1,0,0),
    new THREE.Vector3(),
    .2,
    0xffdf50,
    .09,
    .07
  );
  modelo.add(flecha);
  flechas.push(flecha);
}

// Indicador de colocación.
const aro = new THREE.Mesh(
  new THREE.RingGeometry(.045,.06,40)
    .rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({
    color: 0x43ff98,
    side: THREE.DoubleSide,
    depthTest: false
  })
);

aro.matrixAutoUpdate = false;
aro.visible = false;
escena.add(aro);

function actualizar() {
  const v = Number($("voltaje").value);
  const r = Number($("resistencia").value);

  corriente = cerrado ? v/r : 0;

  $("lectura").textContent =
    `Corriente: ${(corriente*1000).toFixed(0)} mA`;

  $("formula").textContent = cerrado
    ? `${v} V / ${r} Ω = ${corriente.toFixed(3)} A`
    : "Circuito abierto · Corriente = 0 A";

  $("interruptor").textContent = cerrado
    ? "Abrir circuito"
    : "Cerrar circuito";

  brazo.rotation.z = cerrado ? 0 : Math.PI/4;
}

$("voltaje").addEventListener("change",actualizar);
$("resistencia").addEventListener("change",actualizar);

$("interruptor").addEventListener("click",() => {
  cerrado = !cerrado;
  actualizar();
});

actualizar();

// Los botones no deben generar toques dentro de la escena XR.
$("interfaz").addEventListener("beforexrselect",evento => {
  evento.preventDefault();
});

function iniciarBusqueda() {
  buscando = true;
  soporte.visible = false;
  aro.visible = false;

  $("colocar").hidden = false;
  $("colocar").disabled = true;
  $("colocar").textContent = "Buscando superficie…";

  $("mensaje").textContent =
    "Apunta a la mesa y mueve lentamente el teléfono.";
}

$("reubicar").addEventListener("click",iniciarBusqueda);

$("colocar").addEventListener("click",() => {
  if (!sesion || !buscando || !aro.visible) return;

  aro.matrix.decompose(
    soporte.position,
    soporte.quaternion,
    soporte.scale
  );

  soporte.visible = true;
  buscando = false;
  aro.visible = false;

  $("colocar").hidden = true;
  $("mensaje").textContent =
    "Circuito colocado. Muévete lentamente para verlo en 3D.\n" +
    "Las flechas representan corriente convencional; " +
    "su velocidad es ilustrativa.";
});

function restaurar() {
  if (fuenteHit) {
    try { fuenteHit.cancel(); } catch {}
  }

  fuenteHit = null;
  sesion = null;
  buscando = false;
  aro.visible = false;

  soporte.visible = true;
  soporte.position.set(0,0,0);
  soporte.quaternion.identity();
  soporte.scale.setScalar(1);

  camara.position.set(0,.6,.65);
  camara.lookAt(0,0,0);

  renderer.setSize(innerWidth,innerHeight);

  $("iniciar").hidden = false;
  $("iniciar").disabled = false;
  $("iniciar").textContent = "Colocar en mi mesa";

  $("salir").hidden = true;
  $("reubicar").hidden = true;
  $("colocar").hidden = true;

  $("mensaje").textContent =
    "Vista previa 3D. Pulsa «Colocar en mi mesa» para iniciar AR.";
}

$("salir").addEventListener("click",async () => {
  if (sesion) await sesion.end();
});

$("iniciar").addEventListener("click",async () => {
  $("iniciar").disabled = true;
  $("mensaje").textContent = "Iniciando realidad aumentada…";

  try {
    const nuevaSesion = await navigator.xr.requestSession(
      "immersive-ar",
      {
        requiredFeatures: ["hit-test","dom-overlay"],
        domOverlay: { root: $("interfaz") }
      }
    );

    sesion = nuevaSesion;
    sesion.addEventListener("end",restaurar,{once:true});

    await renderer.xr.setSession(sesion);

    const visor = await sesion.requestReferenceSpace("viewer");

    fuenteHit = await sesion.requestHitTestSource({
      space: visor
    });

    $("iniciar").hidden = true;
    $("salir").hidden = false;
    $("reubicar").hidden = false;

    iniciarBusqueda();

  } catch(error) {
    if (sesion) {
      try { await sesion.end(); } catch {}
    }

    restaurar();

    $("mensaje").textContent =
      `No se pudo iniciar AR.\n${error.name}: ${error.message}\n` +
      "Comprueba Chrome y Servicios de Google Play para RA.";
  }
});

renderer.setAnimationLoop((tiempo,frame) => {
  const delta = anterior === null
    ? 0
    : Math.min((tiempo-anterior)/1000,.1);

  anterior = tiempo;

  if (frame && fuenteHit && buscando) {
    // Este es exactamente el espacio que usa el renderizador.
    const referencia = renderer.xr.getReferenceSpace();
    const resultados = frame.getHitTestResults(fuenteHit);

    let poseElegida = null;

    if (referencia) {
      for (const resultado of resultados) {
        const pose = resultado.getPose(referencia);
        if (!pose) continue;

        const matriz = new THREE.Matrix4()
          .fromArray(pose.transform.matrix);

        const normal = new THREE.Vector3(0,1,0)
          .transformDirection(matriz);

        // Aceptar superficies aproximadamente horizontales.
        if (normal.y > .9) {
          poseElegida = pose;
          break;
        }
      }
    }

    aro.visible = !!poseElegida;
    $("colocar").disabled = !poseElegida;

    if (poseElegida) {
      aro.matrix.fromArray(poseElegida.transform.matrix);

      $("colocar").textContent = "Colocar circuito aquí";
      $("mensaje").textContent =
        "Aro verde detectado. Comprueba que esté sobre la mesa.";
    } else {
      $("colocar").textContent = "Buscando superficie…";
    }
  }

  if (cerrado) {
    avance = (avance + corriente*6*delta) % longitudTotal;
  }

  flechas.forEach((flecha,indice) => {
    flecha.visible = cerrado;
    if (!cerrado) return;

    let distancia = (
      avance + indice*longitudTotal/flechas.length
    ) % longitudTotal;

    for (const tramo of tramos) {
      if (distancia <= tramo.longitud) {
        flecha.position.copy(tramo.inicio)
          .addScaledVector(tramo.direccion,distancia);

        flecha.setDirection(tramo.direccion);
        break;
      }
      distancia -= tramo.longitud;
    }
  });

  renderer.render(escena,camara);
});

window.addEventListener("resize",() => {
  if (renderer.xr.isPresenting) return;

  camara.aspect = innerWidth/innerHeight;
  camara.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

async function comprobar() {
  $("mensaje").textContent =
    "Vista previa 3D cargada. Comprobando realidad aumentada…";

  if (!window.isSecureContext || !navigator.xr) {
    $("iniciar").textContent = "AR no disponible";
    $("mensaje").textContent =
      "Abre el enlace HTTPS en Chrome del Galaxy A15 5G.";
    return;
  }

  try {
    const compatible =
      await navigator.xr.isSessionSupported("immersive-ar");

    $("iniciar").disabled = !compatible;
    $("iniciar").textContent = compatible
      ? "Colocar en mi mesa"
      : "AR no disponible";

    $("mensaje").textContent = compatible
      ? "Vista previa 3D. Pulsa «Colocar en mi mesa» para iniciar AR."
      : "Actualiza Chrome y Servicios de Google Play para RA, " +
        "cierra Chrome y vuelve a intentarlo.";

  } catch(error) {
    $("mensaje").textContent =
      "Error al comprobar AR: " + error.message;
  }
}

comprobar();
</script>
</body>
</html>
