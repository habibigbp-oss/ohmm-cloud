<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ley de Ohm · AR diagnóstico 6</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101b2d;color:white;
font-family:Arial,sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#panel{position:absolute;top:10px;left:10px;right:10px;
max-width:420px;max-height:25vh;overflow:auto;
padding:12px;border-radius:12px;background:#101b2deb;
pointer-events:auto}
h1{font-size:18px;margin:0 0 8px}
.fila{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0;
align-items:center}
button,select{font-size:16px;min-height:42px;padding:8px;
border:0;border-radius:7px}
button{background:#236bd4;color:white}
button:disabled{opacity:.45}
label{font-size:14px}
#lectura{font-size:20px;color:#69efb4;font-weight:bold}
#formula,#datos{font-size:12px;margin-top:5px}
#pie{position:absolute;bottom:20px;left:10px;right:10px;
text-align:center}
#mensaje{background:#000c;padding:10px;border-radius:9px;
white-space:pre-line;font-size:14px}
#colocar{pointer-events:auto;background:#14804a;
margin-top:8px}
[hidden]{display:none!important}
</style>
</head>

<body>
<div id="ui">
<section id="panel">
<h1>Ley de Ohm · Versión 6</h1>

<div class="fila">
<button id="iniciar" disabled>Cargando…</button>
<button id="salir" hidden>Salir de AR</button>
<button id="reubicar" hidden>Reubicar</button>
</div>

<div class="fila">
<label>V
<select id="voltaje">
<option value="3">3 V</option>
<option value="6" selected>6 V</option>
<option value="12">12 V</option>
</select>
</label>

<label>R
<select id="resistencia">
<option value="100" selected>100 Ω</option>
<option value="200">200 Ω</option>
<option value="300">300 Ω</option>
</select>
</label>

<button id="interruptor">Abrir circuito</button>
</div>

<div id="lectura"></div>
<div id="formula"></div>

<div class="fila">
<label>
<input type="checkbox" id="diagnostico" checked>
Mostrar cubo rojo de prueba
</label>
</div>

<div id="datos">Preparando escena…</div>
</section>

<div id="pie">
<div id="mensaje" role="status">Descargando motor 3D…</div>
<button id="colocar" hidden disabled>Colocar circuito</button>
</div>
</div>

<script>
window.addEventListener("error", e => {
  const aviso = document.getElementById("mensaje");
  if(aviso && e.message) aviso.textContent = "Error: " + e.message;
});
window.addEventListener("unhandledrejection", e => {
  document.getElementById("mensaje").textContent =
    "Error: " + (e.reason?.message || String(e.reason));
});
</script>

<script type="module">
const $ = id => document.getElementById(id);
const mensaje = texto => $("mensaje").textContent = texto;

let THREE;

try {
  THREE = await import(
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  );
} catch(error) {
  mensaje("No se pudo descargar Three.js. Comprueba internet y recarga.");
  throw error;
}

const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(
  55, innerWidth / innerHeight, 0.01, 30
);

const renderer = new THREE.WebGLRenderer({
  alpha:true,
  antialias:false
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType("local");

document.body.prepend(renderer.domElement);

let sesion = null;
let fuenteHit = null;
let buscando = false;
let colocado = false;
let cerrado = true;
let corriente = 0.06;
let ultimoTiempo = null;
let avance = 0;
let ultimoInforme = 0;
let hayPose = false;
let numeroHits = 0;

// Materiales sin dependencia de iluminación.
// Facilita distinguir problemas de posición y renderizado.
const mat = color => new THREE.MeshBasicMaterial({color});

const soporte = new THREE.Group();
const modelo = new THREE.Group();

modelo.scale.setScalar(0.12);
soporte.add(modelo);
escena.add(soporte);

function caja(w,h,d,color,x,y,z,grupo=modelo){
  const pieza = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d), mat(color)
  );
  pieza.position.set(x,y,z);
  grupo.add(pieza);
  return pieza;
}

function cable(a,b){
  const inicio = new THREE.Vector3(...a);
  const final = new THREE.Vector3(...b);
  const direccion = final.clone().sub(inicio);

  const pieza = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.025,0.025,direccion.length(),10
    ),
    mat(0x39caff)
  );

  pieza.position.copy(inicio).add(final).multiplyScalar(0.5);
  pieza.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),direccion.normalize()
  );
  modelo.add(pieza);
}

function texto(contenido,x,y,z,ancho=1){
  const lienzo = document.createElement("canvas");
  lienzo.width=512;
  lienzo.height=128;

  const ctx=lienzo.getContext("2d");
  ctx.fillStyle="white";
  ctx.font="bold 50px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(contenido,256,64);

  const textura=new THREE.CanvasTexture(lienzo);
  textura.colorSpace=THREE.SRGBColorSpace;

  const pieza=new THREE.Mesh(
    new THREE.PlaneGeometry(ancho,ancho/4),
    new THREE.MeshBasicMaterial({
      map:textura,
      transparent:true,
      side:THREE.DoubleSide,
      depthWrite:false
    })
  );

  pieza.rotation.x=-Math.PI/2;
  pieza.position.set(x,y,z);
  modelo.add(pieza);
}

// Placa de aproximadamente 36 × 29 cm.
caja(3,.08,2.4,0x233750,0,.04,0);

// Batería.
caja(.4,.4,.7,0x24b879,-1.2,.3,0);
caja(.16,.15,.08,0xff5555,-1.2,.25,-.39);
caja(.16,.15,.08,0xcccccc,-1.2,.25,.39);
texto("+",-1.2,.505,-.2,.3);
texto("−",-1.2,.505,.2,.3);

// Resistencia.
caja(.8,.28,.3,0xd8ad72,0,.25,-.9);
texto("R",0,.395,-.9,.35);

texto("LEY DE OHM",.15,.085,-.15,1.4);
texto("V = I × R",.15,.085,.2,1.2);

[
  [[-1.2,.24,-.39],[-1.2,.24,-.9]],
  [[-1.2,.24,-.9],[-.4,.24,-.9]],
  [[.4,.24,-.9],[1.2,.24,-.9]],
  [[1.2,.24,-.9],[1.2,.24,.9]],
  [[1.2,.24,.9],[.35,.24,.9]],
  [[-.35,.24,.9],[-1.2,.24,.9]],
  [[-1.2,.24,.9],[-1.2,.24,.39]]
].forEach(([a,b])=>cable(a,b));

// Interruptor.
caja(.12,.12,.12,0xffffff,-.35,.24,.9);
caja(.12,.12,.12,0xffffff,.35,.24,.9);

const brazo=new THREE.Group();
brazo.position.set(-.35,.24,.9);
modelo.add(brazo);
caja(.7,.07,.12,0xffa530,.35,0,0,brazo);

// Flechas de corriente convencional.
const puntos=[
  [-1.2,.55,-.39],[-1.2,.55,-.9],
  [1.2,.55,-.9],[1.2,.55,.9],
  [-1.2,.55,.9],[-1.2,.55,.39]
].map(p=>new THREE.Vector3(...p));

const tramos=[];
let longitudTotal=0;

for(let i=0;i<puntos.length-1;i++){
  const vector=puntos[i+1].clone().sub(puntos[i]);
  const longitud=vector.length();

  tramos.push({
    inicio:puntos[i],
    direccion:vector.normalize(),
    longitud
  });

  longitudTotal+=longitud;
}

const flechas=[];
for(let i=0;i<8;i++){
  const flecha=new THREE.ArrowHelper(
    new THREE.Vector3(1,0,0),
    new THREE.Vector3(),
    .2,0xffdf50,.09,.07
  );
  modelo.add(flecha);
  flechas.push(flecha);
}

// Aro de colocación.
const aro=new THREE.Mesh(
  new THREE.RingGeometry(.07,.10,40).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({
    color:0x43ff98,
    side:THREE.DoubleSide,
    depthTest:false,
    depthWrite:false
  })
);
aro.matrixAutoUpdate=false;
aro.frustumCulled=false;
aro.renderOrder=999;
aro.visible=false;
escena.add(aro);

// Cubo de diagnóstico: no depende de detectar superficies.
const cuboPrueba=new THREE.Mesh(
  new THREE.BoxGeometry(.06,.06,.06),
  new THREE.MeshBasicMaterial({
    color:0xff2244,
    depthTest:false,
    depthWrite:false
  })
);
cuboPrueba.frustumCulled=false;
cuboPrueba.renderOrder=10000;
cuboPrueba.visible=false;
escena.add(cuboPrueba);

const matrizVisor=new THREE.Matrix4();
const matrizHit=new THREE.Matrix4();
const normal=new THREE.Vector3();

function vistaPrevia(){
  camara.position.set(0,.6,.65);
  camara.lookAt(0,0,0);
  camara.scale.setScalar(1);
  camara.updateMatrixWorld(true);
}
vistaPrevia();

function actualizar(){
  const v=Number($("voltaje").value);
  const r=Number($("resistencia").value);
  corriente=cerrado?v/r:0;

  $("lectura").textContent=
    `Corriente: ${(corriente*1000).toFixed(0)} mA`;

  $("formula").textContent=cerrado
    ? `${v} V / ${r} Ω = ${corriente.toFixed(3)} A`
    : "Circuito abierto: 0 A";

  $("interruptor").textContent=cerrado
    ? "Abrir circuito":"Cerrar circuito";

  brazo.rotation.z=cerrado?0:Math.PI/4;
}

$("voltaje").onchange=actualizar;
$("resistencia").onchange=actualizar;
$("interruptor").onclick=()=>{
  cerrado=!cerrado;
  actualizar();
};
actualizar();

$("ui").addEventListener("beforexrselect",e=>e.preventDefault());

function buscar(){
  if(!sesion || !fuenteHit) return;
  buscando=true;
  colocado=false;
  soporte.visible=false;
  aro.visible=false;
  $("colocar").hidden=false;
  $("colocar").disabled=true;
  mensaje("Mueve lentamente el teléfono sobre una mesa iluminada.");
}

$("reubicar").onclick=buscar;

$("colocar").onclick=()=>{
  if(!sesion || !buscando || !aro.visible || !hayPose) return;

  aro.matrix.decompose(
    soporte.position,soporte.quaternion,soporte.scale
  );

  soporte.updateMatrixWorld(true);
  soporte.visible=true;
  colocado=true;
  buscando=false;
  aro.visible=false;
  $("colocar").hidden=true;

  mensaje(
    "Posición guardada. Comprueba que ves el circuito.\n"+
    "Puedes desmarcar «Mostrar cubo rojo de prueba»."
  );
};

function limpiar(){
  if(fuenteHit){
    try{fuenteHit.cancel();}catch{}
  }

  fuenteHit=null;
  sesion=null;
  buscando=false;
  colocado=false;
  hayPose=false;
  numeroHits=0;
  ultimoTiempo=null;
  aro.visible=false;
  cuboPrueba.visible=false;

  soporte.position.set(0,0,0);
  soporte.quaternion.identity();
  soporte.scale.setScalar(1);
  soporte.visible=true;
  soporte.updateMatrixWorld(true);

  vistaPrevia();
  camara.aspect=innerWidth/innerHeight;
  camara.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);

  $("iniciar").hidden=false;
  $("iniciar").disabled=false;
  $("iniciar").textContent="Iniciar AR";
  $("salir").hidden=true;
  $("reubicar").hidden=true;
  $("colocar").hidden=true;
  $("datos").textContent="Vista previa 3D";
  mensaje("Pulsa «Iniciar AR» para usar la cámara.");
}

$("salir").onclick=async()=>{
  if(sesion){
    try{await sesion.end();}
    catch(error){mensaje(error.message);}
  }
};

$("iniciar").onclick=async()=>{
  $("iniciar").disabled=true;
  mensaje("Iniciando AR…");

  try{
    const nueva=await navigator.xr.requestSession(
      "immersive-ar",{
        requiredFeatures:["hit-test","dom-overlay"],
        domOverlay:{root:$("ui")}
      }
    );

    sesion=nueva;
    nueva.addEventListener("end",limpiar,{once:true});

    camara.position.set(0,0,0);
    camara.quaternion.identity();
    camara.scale.setScalar(1);
    camara.updateMatrix();
    camara.updateMatrixWorld(true);

    await renderer.xr.setSession(nueva);

    if(sesion!==nueva) return;

    const visor=await nueva.requestReferenceSpace("viewer");
    const fuente=await nueva.requestHitTestSource({space:visor});

    if(sesion!==nueva){
      fuente?.cancel();
      return;
    }

    fuenteHit=fuente;

    $("iniciar").hidden=true;
    $("salir").hidden=false;
    $("reubicar").hidden=false;
    buscar();

  }catch(error){
    if(sesion){
      try{await sesion.end();}catch{}
    }
    limpiar();
    mensaje(
      "No se pudo iniciar AR:\n"+
      error.name+": "+error.message
    );
  }
};

renderer.domElement.addEventListener("webglcontextlost",e=>{
  e.preventDefault();
  mensaje("Se perdió el contexto gráfico. Sal de AR y recarga la página.");
});

renderer.setAnimationLoop((tiempo,frame)=>{
  const dt=ultimoTiempo===null
    ?0:Math.min((tiempo-ultimoTiempo)/1000,.1);
  ultimoTiempo=tiempo;

  cuboPrueba.visible=false;
  hayPose=false;
  numeroHits=0;

  if(frame && sesion){
    const referencia=renderer.xr.getReferenceSpace();
    const pose=referencia?frame.getViewerPose(referencia):null;
    hayPose=!!pose;

    if(pose){
      // Posición actual del teléfono, sin depender de la
      // actualización interna de la cámara de Three.js.
      matrizVisor.fromArray(pose.transform.matrix);

      cuboPrueba.position
        .set(0,-.06,-.5)
        .applyMatrix4(matrizVisor);

      cuboPrueba.rotation.set(.3,tiempo/1000,.2);
      cuboPrueba.visible=$("diagnostico").checked;

      if(buscando && fuenteHit){
        const resultados=frame.getHitTestResults(fuenteHit);
        numeroHits=resultados.length;
        let encontrada=false;

        for(const resultado of resultados){
          const hit=resultado.getPose(referencia);
          if(!hit) continue;

          matrizHit.fromArray(hit.transform.matrix);
          normal.set(0,1,0).transformDirection(matrizHit);

          if(normal.y>.9){
            aro.matrix.copy(matrizHit);
            aro.matrix.elements[13]+=.01;
            aro.updateMatrixWorld(true);
            encontrada=true;
            break;
          }
        }

        aro.visible=encontrada;
        $("colocar").disabled=!encontrada;

        $("colocar").textContent=encontrada
          ?"Colocar circuito aquí":"Buscando mesa…";
      }

      if(colocado) soporte.visible=true;
    }else{
      aro.visible=false;
      $("colocar").disabled=true;
      if(colocado) soporte.visible=false;
    }
  }

  if(cerrado){
    avance=(avance+corriente*6*dt)%longitudTotal;
  }

  flechas.forEach((flecha,i)=>{
    flecha.visible=cerrado;
    if(!cerrado) return;

    let distancia=(
      avance+i*longitudTotal/flechas.length
    )%longitudTotal;

    for(const tramo of tramos){
      if(distancia<=tramo.longitud){
        flecha.position.copy(tramo.inicio)
          .addScaledVector(tramo.direccion,distancia);
        flecha.setDirection(tramo.direccion);
        break;
      }
      distancia-=tramo.longitud;
    }
  });

  renderer.render(escena,camara);

  // Estas cifras informan de instrucciones de dibujo,
  // no garantizan por sí solas que el usuario vea el objeto.
  if(sesion && tiempo-ultimoInforme>500){
    ultimoInforme=tiempo;
    $("datos").textContent=
      `Seguimiento: ${hayPose?"sí":"no"} · `+
      `Superficies: ${numeroHits} · `+
      `Dibujos: ${renderer.info.render.calls}`;

    if(buscando){
      mensaje(aro.visible
        ?"Superficie detectada. Busca el aro verde antes de colocar."
        :"Busca una mesa. El cubo rojo debe verse aunque no se detecte.");
    }
  }
});

window.addEventListener("resize",()=>{
  if(renderer.xr.isPresenting) return;
  camara.aspect=innerWidth/innerHeight;
  camara.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

async function comprobar(){
  if(!isSecureContext || !navigator.xr){
    $("iniciar").textContent="AR no disponible";
    mensaje("Abre el enlace HTTPS en Chrome del Galaxy A15 5G.");
    return;
  }

  try{
    const admite=await navigator.xr.isSessionSupported("immersive-ar");
    $("iniciar").disabled=!admite;
    $("iniciar").textContent=admite?"Iniciar AR":"AR no disponible";
    $("datos").textContent="Vista previa 3D";
    mensaje(admite
      ?"Versión 6 cargada. Inicia AR para probar el cubo rojo."
      :"Comprueba Chrome y Servicios de Google Play para RA.");
  }catch(error){
    mensaje("Error al comprobar compatibilidad: "+error.message);
  }
}

comprobar();
</script>
</body>
</html>
