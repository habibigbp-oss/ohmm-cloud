<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Ley de Ohm en realidad aumentada</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      max-width: 390px;
      max-height: 44vh;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 14px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      color: #152238;
      box-shadow: 0 3px 15px #0003;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    p {
      margin: 7px 0;
      font-size: 14px;
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0;
    }

    label {
      font-size: 14px;
    }

    select, button {
      padding: 9px;
      font-size: 16px;
      border-radius: 7px;
      border: 1px solid #aab4c1;
    }

    button {
      background: #175cd3;
      color: white;
      cursor: pointer;
    }

    #resultado {
      font-size: 20px;
      font-weight: bold;
      color: #175cd3;
    }

    #aviso {
      position: fixed;
      bottom: 15px;
      left: 10px;
      right: 10px;
      z-index: 10;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      font-size: 14px;
    }
  </style>

  <script>
    // Estado inicial de la simulación.
    const circuito = {
      voltaje: 6,
      resistencia: 100,
      cerrado: true,
      corriente: 0.06
    };

    // Componente que dibuja los cables y anima las flechas.
    AFRAME.registerComponent("circuito-ohm", {
      init: function () {
        const THREE = AFRAME.THREE;

        // Recorrido: desde el positivo de la batería,
        // por el circuito exterior, hasta el negativo.
        this.puntos = [
          new THREE.Vector3(-1.2, 0.16, -0.35),
          new THREE.Vector3(-1.2, 0.16, -0.9),
          new THREE.Vector3(1.2, 0.16, -0.9),
          new THREE.Vector3(1.2, 0.16, 0.9),
          new THREE.Vector3(-1.2, 0.16, 0.9),
          new THREE.Vector3(-1.2, 0.16, 0.35)
        ];

        this.tramos = [];
        this.longitud = 0;

        const materialCable = new THREE.LineBasicMaterial({
          color: 0x20c4ff
        });

        // Se dejan espacios para resistencia e interruptor.
        const cables = [
          [[-1.2, 0.16, -0.35], [-1.2, 0.16, -0.9]],
          [[-1.2, 0.16, -0.9], [-0.4, 0.16, -0.9]],
          [[0.4, 0.16, -0.9], [1.2, 0.16, -0.9]],
          [[1.2, 0.16, -0.9], [1.2, 0.16, 0.9]],
          [[1.2, 0.16, 0.9], [0.35, 0.16, 0.9]],
          [[-0.35, 0.16, 0.9], [-1.2, 0.16, 0.9]],
          [[-1.2, 0.16, 0.9], [-1.2, 0.16, 0.35]]
        ];

        const grupo = new THREE.Group();

        cables.forEach(extremos => {
          const puntos = extremos.map(
            p => new THREE.Vector3(...p)
          );

          const geometria =
            new THREE.BufferGeometry().setFromPoints(puntos);

          grupo.add(new THREE.Line(geometria, materialCable));
        });

        this.el.setObject3D("cables", grupo);

        // Longitud de cada tramo para mantener
        // un avance uniforme a lo largo del recorrido.
        for (let i = 0; i < this.puntos.length - 1; i++) {
          const inicio = this.puntos[i];
          const final = this.puntos[i + 1];
          const longitud = inicio.distanceTo(final);

          this.tramos.push({
            inicio,
            final,
            longitud,
            direccion: final.clone().sub(inicio).normalize()
          });

          this.longitud += longitud;
        }

        this.flechas = [];

        for (let i = 0; i < 8; i++) {
          const flecha = new THREE.ArrowHelper(
            new THREE.Vector3(1, 0, 0),
            new THREE.Vector3(),
            0.18,
            0xffdd33,
            0.08,
            0.06
          );

          this.el.object3D.add(flecha);
          this.flechas.push(flecha);
        }

        this.avance = 0;
      },

      tick: function (tiempo, delta) {
        const activa =
          circuito.cerrado && circuito.corriente > 0;

        if (activa) {
          // Escala visual ilustrativa.
          // No representa la velocidad real de los electrones.
          const velocidadVisual = circuito.corriente * 6;

          this.avance = (
            this.avance + velocidadVisual * delta / 1000
          ) % this.longitud;
        }

        this.flechas.forEach((flecha, indice) => {
          flecha.visible = activa;

          if (!activa) return;

          let distancia = (
            this.avance +
            indice * this.longitud / this.flechas.length
          ) % this.longitud;

          for (const tramo of this.tramos) {
            if (distancia <= tramo.longitud) {
              flecha.position.copy(tramo.inicio);
              flecha.position.addScaledVector(
                tramo.direccion, distancia
              );

              // Elevar flechas sobre los componentes.
              flecha.position.y = 0.42;
              flecha.setDirection(tramo.direccion);
              break;
            }

            distancia -= tramo.longitud;
          }
        });
      }
    });
  </script>
</head>

<body>
  <div id="panel">
    <h1>Ley de Ohm · Realidad aumentada</h1>

    <p>Apunta la cámara al marcador Hiro.</p>

    <div class="controles">
      <label>
        Voltaje:
        <select id="voltaje">
          <option value="3">3 V</option>
          <option value="6" selected>6 V</option>
          <option value="12">12 V</option>
        </select>
      </label>

      <label>
        Resistencia:
        <select id="resistencia">
          <option value="100" selected>100 Ω</option>
          <option value="200">200 Ω</option>
          <option value="300">300 Ω</option>
        </select>
      </label>
    </div>

    <button id="interruptor" type="button">
      Abrir circuito
    </button>

    <p id="estado">Circuito cerrado</p>

    <p id="resultado" aria-live="polite">I = 60 mA</p>

    <p id="operacion">I = 6 V / 100 Ω = 0.060 A</p>

    <p>
      Modelo ideal. Flechas amarillas:
      corriente convencional, del + al −
      por el circuito exterior.
    </p>
  </div>

  <div id="aviso" role="status">
    Buscando marcador Hiro…
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker id="marcador" preset="hiro">

      <a-entity scale="0.85 0.85 0.85">

        <!-- Base del circuito -->
        <a-box
          position="0 -0.04 0"
          width="2.9"
          height="0.08"
          depth="2.4"
          color="#152238">
        </
